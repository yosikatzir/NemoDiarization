# YAML configuration for Speaker Diarization WITHOUT ASR
# Perfect for Hebrew audio or any language
# This config ONLY does speaker diarization (who spoke when)
# NO transcription, NO text output

name: &name "ClusterDiarizer"

num_workers: 0
sample_rate: 16000
batch_size: 64
device: null # can specify a specific device, i.e: cuda:1 (default cuda if cuda available, else cpu)
verbose: True # enable additional logging

diarizer:
  manifest_filepath: "input_manifest.json"   # your manifest
  out_dir: "output"                          # folder where RTTM/JSON will be saved
  oracle_vad: False
  collar: 0.25
  ignore_overlap: True
  save_rttm: True

  vad:
    model_path: vad_multilingual_marblenet # Multilingual VAD - works with Hebrew!
    external_vad_manifest: null

    parameters:
      window_length_in_sec: 0.63
      shift_length_in_sec: 0.01
      smoothing: median
      overlap: 0.5
      onset: 0.9
      offset: 0.5
      pad_onset: 0
      pad_offset: 0
      min_duration_on: 0.3
      min_duration_off: 0.2
      filter_speech_first: True
      normalize_audio: True

  speaker_embeddings:
    model_path: titanet_large # Language-independent speaker embeddings
    parameters:
      enable_multiscale_clustering: True
      window_length_in_sec: [3.0,2.5,2.0]
      shift_length_in_sec: [1.5,1.25,1.0]
      multiscale_scales: [1,1,1]
      multiscale_weights: [1,1,1]
      save_embeddings: True

  clustering:
    parameters:
      oracle_num_speakers: False
      max_num_speakers: 12
      enhanced_count_thres: 80
      max_rp_threshold: 0.25
      sparse_search_volume: 30
      maj_vote_spk_count: False
      chunk_cluster_count: 50
      embeddings_per_chunk: 10000
      method: ahc
      threshold: null
      auto_tune: True

  # MSDD (optional overlap detection) - language-independent
  msdd_model:
    model_path: null # Set to null to disable, or use diar_msdd_telephonic for overlap detection
    parameters:
      use_speaker_model_from_ckpt: True
      infer_batch_size: 25
      sigmoid_threshold: [0.7]
      seq_eval_mode: False
      split_infer: True
      diar_window_length: 50
      overlap_infer_spk_limit: 5

  # ASR DISABLED - No transcription
  # Perfect for Hebrew or any language - we only need speaker timestamps
  asr:
    model_path: null  # DISABLED - no ASR/transcription
    # If you want English transcription, uncomment and set to: stt_en_conformer_ctc_large
    # For Hebrew, you'll need an external Hebrew ASR tool after diarization

# Output will be RTTM files in output/pred_rttms/ showing:
# - Speaker labels (speaker_0, speaker_1, etc.)
# - Start time and duration for each speaker segment
# - No text transcription
